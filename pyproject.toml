[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "image-relation-inspector"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "PyYAML>=6.0,<7", "python-dotenv>=1.0,<2", "structlog>=24.4,<26",
  "SQLAlchemy>=2.0,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
  "Pillow>=12.3,<13", "ImageHash>=4.3,<5", "numpy>=1.26,<3",
  "XlsxWriter>=3.2,<4",
  "opencv-python>=4.10,<5", "faiss-cpu>=1.9,<2",
  "torch>=2.5,<3", "torchvision>=0.20,<1", "ultralytics>=8.3,<9", "celery[redis]>=5.4,<6"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
