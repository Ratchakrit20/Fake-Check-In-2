app:
  name: Image Relation Inspector
  api_prefix: /api/v1
  reload: true
  max_upload_files: 5000
  max_file_size_mb: 5
  max_image_pixels: 80000000
  max_request_size_mb: 1050
  allowed_mime_types: [image/jpeg, image/png, image/webp, image/tiff, image/bmp]
storage:
  root: data/images
database:
  url: sqlite+aiosqlite:///./data/app.db
embedding:
  enabled: true
  provider: sscd
  model: sscd_disc_mixup
  version: facebookresearch/sscd-copy-detection:disc-mixup
  cache_dir: data/models
  model_path: data/models/sscd_disc_mixup.torchscript.pt
  model_url: https://huggingface.co/m3/sscd-copy-detection/resolve/main/sscd_disc_mixup.torchscript.pt?download=true
  model_sha256: 9f26bd4c848cc19b73d2ae92eea6e04886f61a7b764ceb7a13aeee62e6a6db56
  input_size: 320
  device: auto
  normalize: true
  batch_size: 0 # 0 = เลือกอัตโนมัติตาม CPU/VRAM
  allow_cpu_fallback: true
vector_search:
  provider: faiss
  index_path: data/faiss/sscd.index.bin
  metadata_path: data/faiss/sscd.ids.json
  top_k: 30
phash:
  enabled: true
  hash_size: 8
  max_hamming_distance: 10
sift:
  enabled: true
  max_dimension: 1280
  contrast_threshold: 0.02
  edge_threshold: 15
  sigma: 1.2
  ratio_threshold: 0.75
  min_good_matches: 12
ransac:
  enabled: true
  reprojection_threshold: 5.0
  min_inlier_ratio: 0.30
  min_inliers: 8
flip_detection:
  horizontal: true
body_parts:
  enabled: true
  model_path: data/models/human_mask/organ.pt
  config_dir: data/models/ultralytics
  device: auto
  image_size: 640
  confidence: 0.35
  cache_size: 256
  identity_classes: [head, neck]
  major_classes: [torso, uarm, larm, uleg, lleg]
  reuse_classes: [torso, uarm, larm, uleg, lleg, hand, foot]
  min_reuse_classes: 2
  min_reuse_inliers: 18
  min_major_inliers: 10
  identity_min_inliers: 50
  single_part_suspect_min_inliers: 18
relationship:
  exact_duplicate: 1.0
  very_high_threshold: 0.90
  high_threshold: 0.80
  possible_threshold: 0.65
  graph_edge_threshold: 0.65
  partial_reuse_min_inliers: 30
  partial_reuse_min_inlier_ratio: 0.20
  background_replaced_min_embedding_similarity: 0.45
  # Strong local geometry across the segmented person can prove source reuse
  # even when a generative edit leaves most matches on head/neck.
  foreground_source_min_inliers: 30
  foreground_source_min_inlier_ratio: 0.55
  foreground_source_min_coverage: 0.08
  # Connect suspicious check-ins only when both the location and person retain
  # independent evidence. Background matches alone never merge groups.
  repeated_checkin_min_foreground_inliers: 8
  repeated_checkin_min_foreground_ratio: 0.50
  repeated_checkin_min_foreground_coverage: 0.02
  repeated_checkin_min_identity_inliers: 6
  repeated_checkin_min_reuse_inliers: 4
  same_image_phash_max: 4
  same_image_min_inlier_ratio: 0.50
  recapture_min_inliers: 40
  recapture_min_inlier_ratio: 0.30
  recapture_min_coverage: 0.18
  recapture_min_embedding_similarity: 0.60
  blur_variance_threshold: 160.0
  blurred_crop_min_inliers: 12
  blurred_crop_min_inlier_ratio: 0.25
  blurred_crop_min_embedding_similarity: 0.55
  blurred_crop_max_phash_distance: 22
  # Fallback when blur prevents reliable body-part masks. All four signals
  # (quality, geometry count/ratio/coverage, and SSCD) must pass together.
  blurred_whole_min_inliers: 18
  blurred_whole_min_inlier_ratio: 0.45
  blurred_whole_min_coverage: 0.08
  blurred_whole_strong_inlier_ratio: 0.75
  # Heatmap is supporting evidence only. It is accepted only after reliable
  # foreground alignment and never creates a relationship on its own.
  heatmap_max_foreground_change: 0.35
  heatmap_min_background_change: 0.45
  heatmap_min_change_gap: 0.20
  weights:
    phash: 0.15
    embedding: 0.45
    sift: 0.05
    ransac: 0.35
jobs:
  broker_url: redis://localhost:6379/0
  result_backend: redis://localhost:6379/1
  worker_count: 2
performance:
  auto_tune: true
  cpu_workers: 0 # 0 = เลือกอัตโนมัติจากจำนวนคอร์
  opencv_threads: 0 # 0 = แบ่ง thread ให้เหมาะกับจำนวน worker
  pair_chunk_size: 16
  candidate_min_similarity: 0.25 # SSCD candidate gate; การตัดสินจริงยังต้องผ่าน geometry
logging:
  level: INFO
configuration_version: "1"
